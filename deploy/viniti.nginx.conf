# Evidence Extractor behind nginx. TLS lines are added by certbot.
server {
    listen 80;
    listen [::]:80;
    server_name viniti.cdnvidikturbik.online;

    # public access (requested): anyone can use the site, including admin pages

    client_max_body_size 64m;          # PDF upload limit is 60 MB in the app
    proxy_read_timeout 3600s;          # official checker with OCR can take long
    proxy_send_timeout 3600s;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
